name: CI/CD

# Cada push a main que toque la app corre las pruebas y, si pasan, despliega al VPS.
on:
  push:
    branches: [main]
    paths:
      - "apps/admin/**"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

# Un despliegue a la vez; si llegan varios pushes seguidos, se despliega el más nuevo.
concurrency:
  group: produccion
  cancel-in-progress: false

jobs:
  test:
    name: Pruebas
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: tnl_admin_app
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: tnl_admin_db
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U tnl_admin_app"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DJANGO_SECRET_KEY: solo-para-ci
      DJANGO_DB_PASSWORD: ci
      DJANGO_DB_HOST: 127.0.0.1
      DJANGO_MEDIA_ROOT: /tmp/ci-media
    defaults:
      run:
        working-directory: apps/admin
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/admin/requirements.txt
      - run: pip install -r requirements.txt
      - run: python manage.py check
      - run: python manage.py makemigrations --check --dry-run
      - run: python manage.py test --noinput

  deploy:
    name: Desplegar al VPS
    needs: test
    runs-on: ubuntu-24.04
    steps:
      - name: Desplegar por SSH
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          HOST: ${{ secrets.DEPLOY_HOST }}
          PORT: ${{ secrets.DEPLOY_PORT }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          ssh -i ~/.ssh/deploy_key -p "$PORT" -o BatchMode=yes -o StrictHostKeyChecking=yes \
            "deploy@$HOST" "deploy $GITHUB_SHA"
