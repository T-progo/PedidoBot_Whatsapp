services:
  evolution:
    image: tunegociolisto/evolution-api:v2.3.7-cards3-full-labels3-iafallback5
    container_name: tnl-evolution
    restart: unless-stopped

    env_file:
      - /opt/tunegociolisto/infrastructure/env/evolution.env

    ports:
      - "127.0.0.1:8082:8080"

    volumes:
      - /opt/tunegociolisto/infrastructure/volumes/evolution:/evolution/instances

    networks:
      - backend

    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"

    # Salud del proceso HTTP de Evolution, no de las sesiones WhatsApp.
    # wget viene en la imagen (Alpine/busybox); curl no.
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "-T", "5", "http://127.0.0.1:8080/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 90s

networks:
  backend:
    external: true
    name: tunegociolisto-backend
