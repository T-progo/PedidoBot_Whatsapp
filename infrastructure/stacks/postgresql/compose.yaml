services:
  postgresql:
    image: postgres:17-bookworm
    container_name: tnl-postgresql
    restart: unless-stopped

    ports:
      - "127.0.0.1:5432:5432"

    env_file:
      - /opt/tunegociolisto/infrastructure/env/postgres.env

    environment:
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password

    secrets:
      - postgres_password

    volumes:
      - /opt/tunegociolisto/infrastructure/volumes/postgresql:/var/lib/postgresql/data

    networks:
      - backend

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

    stop_grace_period: 60s

    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"

secrets:
  postgres_password:
    file: /opt/tunegociolisto/infrastructure/secrets/postgres_password

networks:
  backend:
    external: true
    name: tunegociolisto-backend
