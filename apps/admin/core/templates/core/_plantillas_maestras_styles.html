<style>
.pm-shell {
    width: 100%;
}

.pm-heading {
    display:flex;
    justify-content:space-between;
    align-items:flex-start;
    gap:20px;
    margin-bottom:28px;
}

.pm-eyebrow {
    margin:0 0 8px;
    color:var(--green);
    text-transform:uppercase;
    letter-spacing:.12em;
    font-size:12px;
    font-weight:800;
}

.pm-title {
    margin:0;
    font-size:34px;
}

.pm-subtitle {
    margin:8px 0 0;
    opacity:.72;
}

.pm-actions {
    display:flex;
    gap:10px;
    flex-wrap:wrap;
}

.pm-button {
    border:1px solid var(--border);
    background:var(--input-bg);
    color:var(--text);
    padding:11px 16px;
    border-radius:12px;
    text-decoration:none;
    font-weight:750;
    cursor:pointer;
}

.pm-button.primary {
    background:var(--green);
    color:var(--accent-contrast);
    border-color:var(--green);
}

.pm-button.danger {
    color:var(--danger);
}

.pm-grid {
    display:grid;
    grid-template-columns:
        repeat(3, minmax(0,1fr));
    gap:14px;
}

.pm-card {
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:16px;
    padding:18px;
}

.pm-card h3 {
    margin:0 0 8px;
}

.pm-meta {
    opacity:.7;
    font-size:13px;
}

.pm-badge {
    display:inline-flex;
    padding:6px 10px;
    border-radius:999px;
    font-size:12px;
    font-weight:800;
    background:var(--surface-2);
}

.pm-badge.ok {
    color:var(--green);
    background:var(--green-soft);
}

.pm-badge.warn {
    color:var(--warning);
    background:var(--warning-soft);
}

.pm-badge.off {
    color:var(--danger);
    background:var(--danger-soft);
}

.pm-section {
    margin-top:30px;
}

.pm-table-wrap {
    overflow-x:auto;
    border:1px solid var(--border);
    border-radius:16px;
    background:var(--surface);
}

.pm-table {
    width:100%;
    border-collapse:collapse;
    min-width:850px;
}

.pm-table th,
.pm-table td {
    padding:15px 16px;
    text-align:left;
    border-bottom:1px solid var(--border);
}

.pm-table th {
    color:var(--label);
    font-size:12px;
    text-transform:uppercase;
}

.pm-table tr:last-child td {
    border-bottom:0;
}

.pm-form {
    max-width:1000px;
}

.pm-field {
    margin-bottom:18px;
}

.pm-field label {
    display:block;
    margin-bottom:7px;
    font-weight:800;
    color:var(--label);
}

.pm-input {
    width:100%;
    border:1px solid var(--border);
    border-radius:11px;
    padding:11px 13px;
    background:var(--input-bg);
    color:var(--text);
    box-sizing:border-box;
}

.pm-code {
    font-family:monospace;
}

.pm-check {
    width:18px;
    height:18px;
}

.pm-errors {
    margin-top:7px;
    color:var(--danger);
}

.pm-two {
    display:grid;
    grid-template-columns:
        repeat(2,minmax(0,1fr));
    gap:18px;
}

.pm-stat {
    font-size:28px;
    font-weight:800;
    margin-top:6px;
}

.pm-empty {
    padding:30px;
    text-align:center;
    opacity:.7;
}

@media(max-width:900px) {
    .pm-grid,
    .pm-two {
        grid-template-columns:1fr;
    }

    .pm-heading {
        flex-direction:column;
    }
}
</style>
